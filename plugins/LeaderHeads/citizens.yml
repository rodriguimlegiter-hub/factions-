# This is the configuration file where you can change the name tags of the NPCs created by Citizens.


# Name tags of the non-player NPCs.
# The number defines the rank in the leaderboard
# These name tags can be any length
# Variables: {name}, {number}

npc-name-tag:
  '1': '&6&l#{number} &b{name}'
  '2': '&6&l#{number} &b{name}'
  '3': '&6&l#{number} &b{name}'
  '4': '&6&l#{number} &b{name}'
  '5': '&6&l#{number} &b{name}'
  '6': '&6&l#{number} &b{name}'
  '7': '&6&l#{number} &b{name}'
  '8': '&6&l#{number} &b{name}'
  '9': '&6&l#{number} &b{name}'
  '10': '&6&l#{number} &b{name}'
  
# Names of the player NPC's.
# The number defines the rank in the leaderboard
# These name tags can be any length
# Variables: {name}, {number}

player-name-tag:
  '1': '&e#1 &f{name}'
  '2': '&e#2 &f{name}'
  '3': '&e#3 &f{name}'
  '4': '&e#4 &f{name}'
  '5': '&e#5 &f{name}'
  '6': '&e#6 &f{name}'
  '7': '&e#7 &f{name}'
  '8': '&e#8 &f{name}'
  '9': '&e#9 &f{name}'
  '10': '&e#10 &f{name}'


# Version of the config
# Do NOT change this
config-version: 1