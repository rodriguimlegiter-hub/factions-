##############################

menu-settings:
  name: '&8Kits'
  rows: 3
  type: CHEST

  # Comando - Comando usado para abrir o menu. - OPCIONAL
  # Para nao queira usar um comando para abrir o menu deixe apenas as duas aspas em brancos. Exemplo: ''
  # Caso voce queira criar aliases para o comando coloque um ; depois do comando. Exemplo: 'menu; abrirmenu; abre;'
  command: 'kit; kits'

  # Atualizacao automatica - OPCIONAL
  # Isto serve para atualizar os itens do menu automaticamente a cada X segundos.
  auto-refresh: 5

  # Comandos ao abrir - Comandos ou tarefas executadas ao abrir o menu - OPCIONAL
  # Util caso voce queira colocar um SOM ao abrir o MENU ou caso voce queira colocar uma mensagem.
  open-action: 'sound: chest open'

  # Abrir menu com - Item que ao ser clicado abre o menu - OPCIONAL
  # Este menu sera aberto quando o player clicar com o botao direito segurando uma la laranja [35:1]
  open-with-item:
    id: wool:1
    left-click: false
    right-click: true


